<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple personal expense tracker">
  <title>Spendwise | Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">PERSONAL FINANCE</p>
        <h1>Spendwise<span>.</span></h1>
        <p class="hero-copy">Keep every rupee accounted for.</p>
      </div>
      <div class="hero-mark" aria-hidden="true">₹</div>
    </header>

    <section class="summary-card" aria-label="Spending summary">
      <div>
        <p class="card-label">Total spent</p>
        <p class="total">₹<span id="total">0.00</span></p>
      </div>
      <div class="summary-detail">
        <span class="summary-dot"></span>
        <span><strong id="expense-count">0</strong> transactions</span>
      </div>
    </section>

    <section class="content-grid">
      <form id="expense-form" class="expense-form">
        <div class="section-heading">
          <div>
            <p class="eyebrow">QUICK ENTRY</p>
            <h2>Add an expense</h2>
          </div>
          <span class="plus-icon" aria-hidden="true">+</span>
        </div>

        <label for="expense-name">What did you spend on?</label>
        <input id="expense-name" type="text" placeholder="e.g. Morning coffee" autocomplete="off" required>

        <div class="input-row">
          <div class="field">
            <label for="expense-amount">Amount</label>
            <div class="input-with-prefix"><span>₹</span><input id="expense-amount" type="number" placeholder="0.00" min="0.01" step="0.01" required></div>
          </div>
          <div class="field">
            <label for="expense-date">Date</label>
            <input id="expense-date" type="date" required>
          </div>
        </div>

        <label for="expense-category">Category</label>
        <select id="expense-category" required>
          <option value="">Choose a category</option>
          <option>Food</option>
          <option>Travel</option>
          <option>Shopping</option>
          <option>Other</option>
        </select>

        <button type="submit" class="primary-button">Add expense <span aria-hidden="true">→</span></button>
      </form>

      <section class="expenses-panel" aria-labelledby="expenses-title">
        <div class="list-header">
          <div>
            <p class="eyebrow">ACTIVITY</p>
            <h2 id="expenses-title">Recent expenses</h2>
          </div>
          <label class="filter-label" for="filter-category">Filter
            <select id="filter-category">
              <option value="All">All categories</option>
              <option>Food</option>
              <option>Travel</option>
              <option>Shopping</option>
              <option>Other</option>
            </select>
          </label>
        </div>
        <ul id="expense-list" aria-live="polite"></ul>
      </section>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
